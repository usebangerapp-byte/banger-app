# BANGER — iOS build on Codemagic (Mac M2 in the cloud, no local Xcode needed).
# Before the first run, in Codemagic:
#   1. Teams → Integrations → Developer Portal: connect your App Store Connect API key (name it "banger_asc").
#   2. App → Code signing → iOS: let Codemagic manage the "App Store" profile for com.usebanger.app.
# Each push to "main" then builds the app and sends it to TestFlight.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: banger_asc
    environment:
      xcode: latest
      node: 20
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.usebanger.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Use the signing profiles
        script: xcode-project use-profiles
      - name: Build number = Codemagic build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
